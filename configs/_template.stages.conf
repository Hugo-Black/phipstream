# Stage route configuration. Copy to configs/<dataset>.stages.conf and edit.
#
# Run every stage:      bin/phipstream stages configs/<dataset>.stages.conf
# Submit as a PBS job:  bin/phipstream stages configs/<dataset>.stages.conf \
#                           --submit --computerome_project <project>
#
# Keys match the stage options with dashes replaced by underscores. Omit a key
# to take the stage default. Omit adapters entirely when the sample table
# already points at trimmed reads, and the trimming stage is skipped.

[phipstream]
sample_table  = /path/to/sample_table.csv
peptide_table = /path/to/peptide_table.csv
adapters      = /path/to/adapters.csv
out_dir       = /path/to/results

# Read quality reports, written before trimming. The workflow's contamination
# diagnostic reads these archives rather than the reads, so leave this on when
# that module is wanted. Omit the key to skip the stage.
fastqc = true

# Alignment. mode is se_r1, se_r2 or pe. preset is local or end-to-end.
mode   = se_r1
preset = local

# Concurrency. jobs is samples at once, threads is per sample.
jobs    = 8
threads = 2

# Enrichment calling. method is beer or edger. Both come from the bundled
# phip-flow R steps. beer runs edgeR to fit the prior and then BEER over it.
# edger stops after edgeR, which took seconds where BEER took hours on the same
# data, so it suits a deployment check rather than a final analysis.
method               = beer
min_lib_size         = 500
posterior_threshold  = 0.5
seed                 = 20260101

# Prioritisation. Point these at the columns this dataset actually uses.
role_column     = sample_role
role            = serum
group_column    = participant_ID
antigen_columns = virus,antigen
position_column = tile_start
tile_step       = 28

# Batch resources, used only with --submit.
walltime = 24:00:00
ppn      = 8
mem      = 32gb
modules  = tools apptainer

# Interpreter with pandas on the cluster. Defaults to the one invoking phipstream.
# python = /path/to/venv/bin/python

# Parameters for the bundled workflow, used only with --workflow:
#
#   bin/phipstream stages configs/<dataset>.stages.conf --workflow
#
# That route covers the scoring layers the stages do not, CPM, z scores and
# gamma-Poisson, plus the library QC and contamination modules. It writes no
# shortlist. Keys are case sensitive because they become workflow parameter
# names, so run_BEER is not run_beer.
#
# sample_table, peptide_table and the adapter lists are taken from the section
# above, so a dataset cannot describe itself twice. Anything set here wins, and
# results defaults to a workflow directory under out_dir.
[workflow]
dataset_prefix    = dataset
read_length       = 151
oligo_tile_length = 168
alignment_mode    = SE_R1

run_cpm_enr_workflow   = true
run_zscore_fit_predict = true
run_gamma_poisson      = false
run_edgeR              = true
run_BEER               = false
output_wide_csv        = true

run_library_qc     = true
library_qc_dna_col = oligo

# Reference sequences to identify overrepresented reads against, as FASTA.
run_contamination_diagnostic = true
contamination_sources_dir    = /path/to/contamination_sources
